name: Update Match Calendars (Japan National Team & Kashima Antlers)

on:
  schedule:
    # 毎日 日本時間 午前4:00（UTC 19:00）に自動実行
    - cron: '0 19 * * *'
  workflow_dispatch: # GitHubのActionsタブから手動実行可能
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'j1_club.py'
      - '.github/workflows/update.yml'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run calendar generators
        run: |
          echo "=== 1. Updating Japan National Team Calendar ==="
          python main.py
          echo "=== 2. Updating Kashima Antlers Calendar ==="
          python j1_club.py

      - name: Commit and push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add japan_national_team.ics j1_club.ics
          if git diff --staged --quiet; then
            echo "No changes to commit. Calendars are already up-to-date."
          else
            git commit -m "Auto update: match calendars (japan_national_team.ics, j1_club.ics) [skip ci]"
            git push
          fi
